<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人を動かす（オンライン）</title>

<style>
body { font-family: sans-serif; background:#f5f5f5; text-align:center; }

#game {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

#board {
  display:grid;
  grid-template-columns:repeat(8,60px);
  gap:4px;
}

.cell {
  width:60px;height:60px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;
  cursor:pointer;
}

.cell:hover { transform:scale(1.05); }

.p1 { background:#4da6ff; color:#fff; }
.p2 { background:#ff6666; color:#fff; }
.neutral { background:#ddd; }

.selected { outline:4px solid yellow; }
.highlight { box-shadow:0 0 10px gold inset; }

#panel { width:200px; }

button {
  width:100%;
  margin:4px 0;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#333;
  color:#fff;
}

button.active { background:#ffcc00; color:#000; }

#turn { font-size:20px; margin-bottom:10px; }

#log {
  margin-top:10px;
  height:150px;
  overflow:auto;
  background:#fff;
  border-radius:6px;
  padding:5px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>人を動かす（オンライン）</h1>

<div id="game">
  <div>
    <div id="turn"></div>
    <div id="board"></div>
  </div>

  <div id="panel">
    <button onclick="setAction('移動')">移動</button>
    <button onclick="setAction('説得')">説得</button>
    <button onclick="setAction('攻撃')">攻撃</button>
    <button onclick="setAction('扇動')">扇動</button>
    <button onclick="setAction('命令')">命令</button>
    <div id="log"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>

<script>
// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyAHQufe4vI0Q7-iuIY7Q2WoRqKDR8p7JeU",
  authDomain: "operatingus-390a7.firebaseapp.com",
  databaseURL: "https://operatingus-390a7-default-rtdb.firebaseio.com",
  projectId: "operatingus-390a7",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
const room = params.get("room") || "test";
const myPlayer = location.hash === "#p2" ? "P2" : "P1";

const SIZE = 8;
let board = [];
let turn = "P1";
let selected = null;
let action = "移動";

const TYPES = {
  "一般人": { persuade:4, attack:5 },
  "強い人": { persuade:5, attack:3 },
  "臆病者": { persuade:3, attack:6 },
  "扇動者": { persuade:5, attack:5 },
  "裏切り者": { persuade:2, attack:4 }
};

function rand(n){return Math.floor(Math.random()*n);}

function log(msg){
  const el = document.getElementById("log");
  el.innerHTML += msg + "<br>";
  el.scrollTop = el.scrollHeight;
}

function setAction(a){
  action = a;
  document.querySelectorAll("button").forEach(b=>{
    b.classList.remove("active");
    if(b.textContent === a) b.classList.add("active");
  });
}

function initState(){
  let b = Array(SIZE).fill().map(()=>Array(SIZE).fill(null));
  b[7][0] = {type:"P1",side:"P1"};
  b[0][7] = {type:"P2",side:"P2"};

  let pool = [
    ...Array(8).fill("一般人"),
    ...Array(3).fill("強い人"),
    ...Array(2).fill("臆病者"),
    ...Array(2).fill("扇動者"),
    ...Array(1).fill("裏切り者")
  ].sort(()=>Math.random()-0.5);

  let i=0;
  while(i<pool.length){
    let x=rand(8),y=rand(8);
    if(!b[y][x]){
      b[y][x]={type:pool[i],side:"neutral"};
      i++;
    }
  }
  return {board:b,turn:"P1"};
}

const gameRef = db.ref("games/" + room);

gameRef.on("value", (snap)=>{
  let data = snap.val();

  if(!data){
    const init = initState();
    gameRef.set(init);

    board = init.board;
    turn = init.turn;
    draw();
    return;
  }

  board = Object.values(data.board).map(row => Array.isArray(row)?row:Object.values(row));
  turn = data.turn;

  draw();
});

function draw(){
  const el=document.getElementById("board");
  el.innerHTML="";

  board.forEach((row,y)=>{
    if(!Array.isArray(row)) return;

    row.forEach((c,x)=>{
      const d=document.createElement("div");
      d.className="cell";

      if(c){
        d.classList.add(c.side==="neutral"?"neutral":c.side.toLowerCase());
        d.textContent = c.type==="P1"||c.type==="P2"?c.type:c.type[0];
      }

      if(selected && selected.x===x && selected.y===y){
        d.classList.add("selected");
      }

      if(selected){
        let dx=Math.abs(selected.x-x);
        let dy=Math.abs(selected.y-y);
        if(dx+dy===1) d.classList.add("highlight");
      }

      d.onclick=()=>click(x,y);
      el.appendChild(d);
    });
  });

  document.getElementById("turn").textContent = `Turn: ${turn} / You: ${myPlayer}`;
}

function click(x,y){
  if(turn!==myPlayer) return;

  if(!selected){
    selected={x,y};
    draw();
    return;
  }

  let from=selected;
  let to={x,y};
  let a=board[from.y][from.x];
  let t=board[to.y][to.x];

  let dx=Math.abs(from.x-to.x);
  let dy=Math.abs(from.y-to.y);
  let adj=dx+dy===1;

  if(action==="移動" && adj && !t){
    board[to.y][to.x]=a;
    board[from.y][from.x]=null;
    log("移動");
  }

  if(action==="説得" && adj && t && t.side==="neutral"){
    if(rand(6)+1>=TYPES[t.type].persuade){
      t.side=turn;
      log("説得成功");
    } else log("説得失敗");
  }

  if(action==="攻撃" && adj && t){
    if(t.type==="P1"||t.type==="P2"){
      if(rand(6)+1>=4){ alert(turn+" 勝利！"); }
    } else {
      if(rand(6)+1>=TYPES[t.type].attack){
        board[to.y][to.x]=null;
        log("撃破");
      } else log("攻撃失敗");
    }
  }

  if(action==="扇動"){
    log("扇動");
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        let nx=from.x+dx, ny=from.y+dy;
        let c=board[ny]?.[nx];
        if(c && c.side==="neutral"){
          if(rand(6)+1>=TYPES[c.type].persuade){
            c.side=turn;
          }
        }
      }
    }
  }

  selected=null;
  turn = turn==="P1"?"P2":"P1";

  gameRef.set({board,turn});
}
</script>

</body>
</html>
