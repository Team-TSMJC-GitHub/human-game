<style>
body { font-family: sans-serif; text-align:center; background:#f5f5f5; }

#game {
  display:flex;
  justify-content:center;
  gap:20px;
}

#board {
  display:grid;
  grid-template-columns:repeat(8,60px);
  gap:4px;
}

.cell {
  width:60px;height:60px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.cell:hover { transform:scale(1.05); }

.p1 { background:#4da6ff; color:#fff; }
.p2 { background:#ff6666; color:#fff; }
.neutral { background:#ddd; }

.selected {
  outline:4px solid yellow;
}

.highlight {
  box-shadow:0 0 10px gold inset;
}

#panel {
  width:200px;
}

button {
  width:100%;
  margin:4px 0;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#333;
  color:#fff;
}

button.active {
  background:#ffcc00;
  color:#000;
}

#turn {
  font-size:20px;
  margin-bottom:10px;
}

#log {
  margin-top:10px;
  height:150px;
  overflow:auto;
  background:#fff;
  border-radius:6px;
  padding:5px;
  font-size:12px;
}
</style>
